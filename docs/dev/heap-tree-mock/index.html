// =====================================================================
// 쪽지 (folded note)
//
// The classroom knot (Yoon's reference, refs/jjokji-steps.png). Closing order; opening plays it backwards:
//   0  portrait sheet folded in half lengthwise, then in half again -> long strip (4 layers)
//   1  strip lying horizontal
//   2  the left end folds down on a 45° crease: a short tip hangs down (mirrored ㄱ)
//   3  the long part folds down on the other diagonal, beside the tip: two tails and a peaked roof
//   4  the long end folds on 45° to the left, in front of the tip: one tail left, one tail down
// Finished: a diamond head with a + of creases, a band running left, a tail running down.
//
// Geometry: the sheet is cut into strip segments along the creases, each segment into its
// 4 lengthwise columns (crease positions mirror from column to column, as on a real unfolded 쪽지).
// Every crease is a hinge: a group at a point on the crease, rotated about the crease line.
// The roof triangle is the root and never moves, so the writing side always faces the viewer.
//
// buildPacket(data) makes one packet from { name, date, msg, reply? } and knows nothing about the
// tree, so a writing flow can reuse it.
// =====================================================================
const KW = 0.036;                             // strip width = sheet width / 4
const STRIP_L = 6.5 * KW;                     // strip length = sheet height
const SHEET = { W: 4 * KW, H: STRIP_L };      // 0.144 x 0.234 m
const LD = 0.00008;                           // one paper layer of separation
const INSIDE_SCALE = 0.35;                    // a closed packet inside its ornament
const REPLY = { W: 0.064, H: 0.08, COLS: 2, ROWS: [0.5, 0.5], DZ: 0.00003 };
const FAN_FONTS = ['Nanum Pen Script', 'Gaegu', 'Hi Melody', 'Gamja Flower', 'Cute Font', 'Single Day', 'Yeon Sung'];
const REPLY_FONT = 'East Sea Dokdo';
// some hands draw small for their px size; scale them so every hand reads at a similar size
const FONT_SCALE = { 'Nanum Pen Script': 1.3, 'Gaegu': 1.0, 'Hi Melody': 1.15, 'Gamja Flower': 1.0, 'Cute Font': 1.3, 'Single Day': 0.95, 'Yeon Sung': 1.0, 'East Sea Dokdo': 1.3 };
const NOTE_TINTS = ['#fbf7ee', '#f6efdf', '#f9f4ea', '#f2eadb', '#fdf9f2'];
const REPLY_TINT = '#f3d5bf';
const FRONT_PX = [1200, 1950], REPLY_PX = [720, 900], BACK_PX = [400, 650];

const hashStr = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return h >>> 0; };
const fontFor = data => FAN_FONTS[hashStr(data.name ?? ('익명:' + data.msg)) % FAN_FONTS.length];
const tintFor = data => NOTE_TINTS[hashStr(data.msg) % NOTE_TINTS.length];

// --- crease layout ---
// Designed in "strip coords" (X along the strip, lying horizontal as in the reference, Y across, 0..w),
// then turned 90° into sheet coords (x right 0..W, y up 0..H) for column 0: (X, Y) -> (w - Y, X).
const w = KW, TIP = 1.8 * w, L = STRIP_L;
const toSheet = ([X, Y]) => [w - Y, X];
const dirToSheet = ([dX, dY]) => [-dY, dX];
const SEGS_STRIP = {
  ROOF: [[TIP, 0], [TIP + w, w], [TIP + 2 * w, 0]],                    // root: the roof triangle, never moves
  TIP:  [[0, 0], [TIP, 0], [TIP + w, w], [0, w]],                      // short end, hangs down (step 2)
  TAIL: [[TIP + w, w], [TIP + 3 * w, w], [TIP + 2 * w, 0]],            // folds down beside the tip (step 3)
  BAND: [[TIP + 2 * w, 0], [TIP + 3 * w, w], [L, w], [L, 0]],          // long end, turns left in front (step 4)
};
const SEGS = Object.fromEntries(Object.entries(SEGS_STRIP).map(([k, pts]) => [k, pts.map(toSheet)]));
// [child, parent, point on crease, crease direction, a point inside the child, hinge height] (strip coords)
// hinge heights put each layer on its own level: tip behind the roof, tail in front, band in front of all
const CREASES_STRIP = [
  ['TIP', 'ROOF', [TIP, 0], [1, 1], [TIP * 0.5, 0.5 * w], -0.5 * LD],
  ['TAIL', 'ROOF', [TIP + w, w], [1, -1], [TIP + 2 * w, 0.7 * w], 11 * LD],
  ['BAND', 'TAIL', [TIP + 2 * w, 0], [1, 1], [TIP + 4 * w, 0.5 * w], -1 * LD],
];
const CREASES = CREASES_STRIP.map(([c, p, pt, d, ins, h]) => [c, p, toSheet(pt), dirToSheet(d), toSheet(ins), h]);
// lengthwise folds: column hinges at x = w, 2w, 3w. Half then half again: middle first, then both others.
// strip layers land at 0, 2, 4, 10 LD (col 0, 3, 2, 1): the gap under the top layer holds a folded reply
const COL_HEIGHT = [0, 5 * LD, 3 * LD, -1 * LD];
const COL_MAP = [x => x, x => 2 * w - x, x => 2 * w + x, x => 4 * w - x];

// --- hinge: a group on the crease; content inside is back in the parent's coordinates ---
function makeHinge(parent, px, py, height, dir, inside) {
  const axis = new THREE.Vector3(dir[0], dir[1], 0).normalize();
  const P = new THREE.Vector3(px, py, height);
  const rel = new THREE.Vector3(inside[0] - px, inside[1] - py, 0);
  const side = rel.sub(axis.clone().multiplyScalar(rel.dot(axis))).normalize();
  // swing toward the side the panel lands on (sign of the hinge height)
  const sgn = Math.sign(height || 1) * Math.sign(new THREE.Vector3().crossVectors(axis, side).z || 1);
  const group = new THREE.Group(); group.position.copy(P); parent.add(group);
  const content = new THREE.Group(); content.position.copy(P).negate(); group.add(content);
  return { group, content, axis, fold: sgn * Math.PI };
}
const setHinge = (h, f) => h.group.quaternion.setFromAxisAngle(h.axis, f * h.fold);

function polyGeometry(pts) {
  const geo = new THREE.ShapeGeometry(new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y))));
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / SHEET.W, pos.getY(i) / SHEET.H);
  return geo;
}

function buildKnot(front, back) {
  const root = new THREE.Group(), segs = {}, cols = [[], [], [], []], fronts = [];
  function segment(name, content) {
    let parent = content; const cells = [];
    for (let c = 0; c < 4; c++) {
      let cell = content;
      if (c > 0) { const h = makeHinge(parent, c * w, 0, COL_HEIGHT[c], [0, 1], [c * w + 0.01, 0]); cols[c].push(h); cell = h.content; }
      const geo = polyGeometry(SEGS[name].map(([x, y]) => [COL_MAP[c](x), y]));
      const fm = new THREE.Mesh(geo, front), bm = new THREE.Mesh(geo, back);
      fm.castShadow = bm.castShadow = true; cell.add(fm, bm); fronts.push(fm);
      cells.push(cell); parent = cell;
    }
    segs[name] = { content, cells };
  }
  segment('ROOF', root);
  const hinges = {};
  for (const [child, parent, [px, py], dir, inside, height] of CREASES) {
    const h = makeHinge(segs[parent].content, px, py, height, dir, inside);
    hinges[child] = h; segment(child, h.content);
  }
  return { root, hinges, cols, fronts, segs };
}

// --- reply: a small sheet folded 2 x 3, accordion style (as v1) ---
function buildAccordion(spec, front, back) {
  const { W, H, COLS, ROWS, DZ } = spec;
  const cw = W / COLS, rh = ROWS.map(f => f * H);
  const offC = DZ, offR = 2 * DZ * (COLS - 1) + 3 * DZ;
  const root = new THREE.Group(), rowHinges = [], colHinges = [];
  let parentRow = root, yTop = 0;
  for (let r = 0; r < ROWS.length; r++) {
    let rowContent = new THREE.Group();
    if (r === 0) root.add(rowContent);
    else {
      const s = r % 2 ? 1 : -1, g = new THREE.Group();
      g.position.set(0, -rh[r - 1], s * offR); rowContent.position.z = -s * offR;
      g.add(rowContent); parentRow.add(g);
      rowHinges.push({ group: g, axis: new THREE.Vector3(1, 0, 0), fold: -s * Math.PI });
    }
    let parentCell = rowContent;
    for (let c = 0; c < COLS; c++) {
      let cell = new THREE.Group();
      if (c === 0) rowContent.add(cell);
      else {
        const t = c % 2 ? 1 : -1, g = new THREE.Group();
        g.position.set(cw, 0, t * offC); cell.position.z = -t * offC;
        g.add(cell); parentCell.add(g);
        (colHinges[c - 1] ||= []).push({ group: g, axis: new THREE.Vector3(0, 1, 0), fold: -t * Math.PI });
      }
      const geo = new THREE.PlaneGeometry(cw, rh[r]); geo.translate(cw / 2, -rh[r] / 2, 0);
      const uv = geo.attributes.uv, u0 = c / COLS, u1 = (c + 1) / COLS, vT = 1 - yTop / H, vB = 1 - (yTop + rh[r]) / H;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + uv.getX(i) * (u1 - u0), vB + uv.getY(i) * (vT - vB));
      const fm = new THREE.Mesh(geo, front), bm = new THREE.Mesh(geo, back);
      fm.castShadow = bm.castShadow = true; cell.add(fm, bm);
      parentCell = cell;
    }
    parentRow = rowContent; yTop += rh[r];
  }
  return { root, rowHinges, colHinges, cw, rh };
}

// --- text: grapheme- and word-aware wrapping ---
const segWord = new Intl.Segmenter('ko', { granularity: 'word' });
const segGraph = new Intl.Segmenter('ko', { granularity: 'grapheme' });
const graphemes = s => Array.from(segGraph.segment(s), x => x.segment);
const CLOSERS = new Set(['.', ',', '!', '?', ')', '」', '』', '…', '~', ':', ';', ']', '}', '’', '”', '%', '·', '。', '、']);

// a line never starts with closing punctuation: it hangs on the line before instead
function wrap(g, text, maxW) {
  const out = [];
  const fits = s => g.measureText(s).width <= maxW;
  for (const para of text.split('\n')) {
    let line = '';
    const flush = () => { out.push(line.trimEnd()); line = ''; };
    for (const { segment } of segWord.segment(para)) {
      if (fits((line + segment).trimEnd())) { line += segment; continue; }
      if (!segment.trim()) { if (line.trim()) flush(); continue; }         // break at a space, drop it
      const gs = graphemes(segment);
      if (line.trim() && !CLOSERS.has(gs[0]) && fits(segment)) { flush(); line = segment; continue; }
      for (const gp of gs) {
        if (line.trim() && !fits(line + gp) && !CLOSERS.has(gp)) flush();
        line += gp;
      }
    }
    out.push(line.trimEnd());
  }
  return out.map(l => l.trimStart());
}
function ellipsize(g, s, maxW) {
  let gs = graphemes(s);
  while (gs.length && g.measureText(gs.join('') + '…').width > maxW) gs.pop();
  return gs.join('') + '…';
}
// largest size whose wrapped text fits the box; short notes come out big, long notes small, never under minPx
function fitText(g, text, font, boxW, boxH, maxPx, minPx) {
  let fit;
  // a closer hung onto a full line can overshoot boxW, so widths are checked too
  const widthOk = lines => lines.every(l => g.measureText(l).width <= boxW);
  for (let px = maxPx; px >= minPx; px -= 4) {
    g.font = `${px}px "${font}"`; const lines = wrap(g, text, boxW), lh = px * 1.22;
    fit = { px, lines, lh };
    if (lines.length * lh <= boxH && widthOk(lines)) return fit;
  }
  // smallest size: wrap narrower so hung punctuation stays inside the box
  if (!widthOk(fit.lines)) fit.lines = wrap(g, text, boxW - g.measureText('……').width);
  const keep = Math.max(1, Math.floor(boxH / fit.lh));
  if (fit.lines.length > keep) { fit.lines = fit.lines.slice(0, keep); fit.lines[keep - 1] = ellipsize(g, fit.lines[keep - 1], boxW); }
  return fit;
}
// one line: shrink to fit, then cut with an ellipsis
function fitLine(g, text, family, maxPx, minPx, maxW, weight = '') {
  let px = maxPx;
  for (; px > minPx; px -= 2) { g.font = `${weight}${px}px ${family}`; if (g.measureText(text).width <= maxW) return { px, text }; }
  g.font = `${weight}${minPx}px ${family}`;
  return { px: minPx, text: g.measureText(text).width <= maxW ? text : ellipsize(g, text, maxW) };
}

function buildPacket(data) {

  const knot = buildKnot(fanFront, fanBackMat);

  // open the sheet stands upright. It turns during the flight, face always toward the viewer.
  const root = new THREE.Group(), centerer = new THREE.Group(), spin = new THREE.Group();
  root.add(centerer); centerer.add(spin); spin.add(knot.root);
  const p = { data, root, centerer, spin, knot, mats: [fanFront, fanBackMat], fanFront, t: 0, reply: null, textOn: false };

  if (data.reply) {

    const sheet = buildAccordion(REPLY, rFront, rBackMat);

    const tuck = { p: new THREE.Vector3(1.5 * w - fw / 2, bandMid + fh / 2, 0.00004), rz: 0 };

    const show = { p: new THREE.Vector3(SHEET.W * 0.47, SHEET.H * 0.52, 0.004), rz: -0.06 };
    sheet.root.position.copy(tuck.p);

    { k: 'h', d: 0.55, hs: [H.TAIL] },                                 // 2 the diagonal unfolds: back to the L
    { k: 'h', d: 0.5, hs: [H.TIP] },                                   // 3 the 45° tip unfolds: a straight strip

  if (data.reply) loads.push(document.fonts.load(`40px "${REPLY_FONT}"`, data.reply));

      mesh(new THREE.ConeGeometry(0.018, 0.026, 6), m.main, H, [sgn * 0.052, 0, 0], [0, 0, sgn * Math.PI / 2]);
      return H;
    };
    const L = half(-1), Rt = half(1);
    mesh(loopGeo(), m.accent, g, [0, 0.03, 0]);
    return f => {
      L.position.x = -0.032 * f; Rt.position.x = 0.032 * f;
      L.rotation.z = 0.25 * f; Rt.rotation.z = -0.25 * f;
    };
  },
};

function buildOrnament(kind, colors) {
  const group = new THREE.Group(), body = new THREE.Group(); group.add(body);
  const mats = ornMats();
  const setOpenRaw = BUILD[kind](body, mats);
  // one size for every kind: the largest extent is ORN
  setOpenRaw(0); body.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(body), size = bb.getSize(new THREE.Vector3()), mid = bb.getCenter(new THREE.Vector3());
  const k = ORN / Math.max(size.x, size.y, size.z);
  body.scale.setScalar(k); body.position.copy(mid).multiplyScalar(-k);
  const o = { group, kind, mats, top: size.y * k / 2, colors: { ...colors }, dim: 1 };
  o.setOpen = f => setOpenRaw(f);
  o.setColors = c => { Object.assign(o.colors, c); o.setDim(o.dim); };
  o.setDim = d => {
    o.dim = d;
    mats.main.color.set(o.colors.main).multiplyScalar(d);
    mats.accent.color.set(ACCENTS[o.colors.accent] ?? o.colors.accent).multiplyScalar(d);
    mats.accent.metalness = o.colors.accent === 'cream' ? 0 : 0.2;
  };
  o.setDim(1);
  o.dispose = () => { group.traverse(x => { if (x.isMesh) x.geometry.dispose(); }); mats.main.dispose(); mats.accent.dispose(); };
  return o;
}
// =====================================================================

// ---------- notes: an ornament carrying a folded 쪽지 ----------
const notes = [];
const raycaster = new THREE.Raycaster();
let rnd = 11; const rand = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;
let tree = null, viewKind = 'mixed';
const N_FLY = 0.35, N_OPEN_AT = 0.45, N_OPEN = 0.4, N_GAP = 0.05;

function buildNote(data, kind, colors) {
  const root = new THREE.Group(), pk = buildPacket(data);
  root.add(pk.root);
  const n = { data, baseKind: kind, kind, colors: { ...colors }, root, pk, orn: null, t: 0, lift: 0, shellDrop: 0.1 };
  n.offset = N_OPEN_AT + N_OPEN + N_GAP;
  n.total = n.offset + pk.total;
  setNoteKind(n, kind);
  return n;
}
function setNoteKind(n, kind) {
  if (n.orn) { n.root.remove(n.orn.group); n.orn.dispose(); }
  n.orn = buildOrnament(kind, n.colors); n.kind = kind;
  n.root.add(n.orn.group);
  n.root.traverse(o => { o.userData.note = n; });
  if (n.plan) seatOnPlan(n);
  applyNote(n, n.t);
}
// pose at time t: fly in, open the shell, then the packet's own timeline (rise, unfold, reply)
function applyNote(n, t) {
  n.t = t;
  const clamp01 = v => THREE.MathUtils.clamp(v, 0, 1);
  const fFly = ease(clamp01(t / N_FLY));
  if (n.flight) {
    n.root.position.lerpVectors(n.flight.from.p, n.flight.to.p, fFly);
    n.root.quaternion.slerpQuaternions(n.flight.from.q, n.flight.to.q, fFly);
  }
  n.orn.setOpen(ease(clamp01((t - N_OPEN_AT) / N_OPEN)));
  const tp = t - n.offset, rise = n.pk.segs[0], fR = ease(clamp01((tp - rise.s) / rise.d));
  // the shell eases down toward the bottom edge, dimmed, as the packet rises out of it
  n.orn.group.position.set(0, -n.shellDrop * fR, -0.03 * fR);
  n.orn.group.scale.setScalar(1 - 0.25 * fR);
  n.orn.setDim(1 - 0.45 * fR);
  applyPose(n.pk, Math.max(0, tp));
}

// ---------- tree placement ----------
function surfaceHit(a, h) {
  const R = 1.5, out = new THREE.Vector3(Math.sin(a), 0, Math.cos(a));
  raycaster.set(new THREE.Vector3(out.x * R, h, out.z * R), out.clone().negate()); raycaster.far = R;
  const hit = raycaster.intersectObject(tree, true)[0];
  if (!hit) return null;
  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  if (n.dot(out) < 0) n.negate();
  return { point: hit.point, n, r: R - hit.distance, out };
}
function visibleFromEye(pt) {
  const dir = pt.clone().sub(camera.position), d = dir.length();
  raycaster.set(camera.position, dir.normalize()); raycaster.far = d + 0.05;
  const hit = raycaster.intersectObject(tree, true)[0];
  if (hit && hit.distance < d - 0.02) return false;
  const v = pt.clone().project(camera);
  return Math.abs(v.x) < 0.9 && Math.abs(v.y) < 0.9;
}
// random spots over the front (±75°), all heights; spacing, Kenney baubles and visibility are tested on
// the ornament's own centre (a hanging one sits below its anchor)
function placeNotes() {
  camera.updateMatrixWorld();
  const ARC = THREE.MathUtils.degToRad(75), plans = [];
  let minD = 0.135;
  for (let tries = 1; plans.length < cards.length && tries < 30000; tries++) {
    if (tries % 3000 === 0) minD *= 0.94;
    const a = (rand() * 2 - 1) * ARC, h = 0.3 + rand() * 1.15;
    const hit = surfaceHit(a, h);
    if (!hit || hit.r < 0.12) continue;
    if (rand() > hit.r / 0.5) continue; // area weighting: wider parts of the tree get more notes
    const plan = planSpot({ a, h, ...hit });
    if (plans.some(q => q.centre.distanceTo(plan.centre) < minD)) continue;
    if (KENNEY_BAUBLES.some(k => k.distanceTo(plan.centre) < KENNEY_BAUBLE[0] / 2 + ORN / 2 + 0.015)) continue;
    if (!visibleFromEye(plan.face)) continue; // the camera is fixed: every note must be reachable
    plans.push(plan);
  }
  // every kind appears: deal them from a shuffled deck of whole sets
  const deck = cards.map((_, i) => KINDS[i % KINDS.length]);
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  cards.forEach((data, i) => {
    const kind = deck[i];
    const main = MAIN_SWATCHES[Math.floor(rand() * MAIN_SWATCHES.length)][1];
    const accent = Object.keys(ACCENTS)[Math.floor(rand() * 3)];
    const n = buildNote(data, kind, { main, accent }); n.i = i;
    hangOnTree(n, plans[i]); notes.push(n);
  });
}
function planSpot(spot) {
  const plan = { spot, hang: rand() < 0.6, L: 0.015 + rand() * 0.02, roll: (rand() - 0.5) * 0.3, pivotPos: new THREE.Vector3(), pivotQuat: new THREE.Quaternion() };
  plan.pivotQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), spot.a);
  if (plan.hang) {
    // hangs from a short clay string, clear of the foliage under the anchor
    plan.pivotPos.copy(spot.point).addScaledVector(spot.out, -0.004);
    let rMax = spot.r;
    for (let hh = spot.h - plan.L - ORN; hh <= spot.h - plan.L; hh += 0.008) { const s = surfaceHit(spot.a, hh); if (s) rMax = Math.max(rMax, s.r); }
    plan.zOut = rMax - spot.r + ORN * 0.42;
    plan.centreLocal = new THREE.Vector3(0, -plan.L - ORN / 2, plan.zOut);
  } else {
    // seated in the branches: the back third sits in the foliage
    plan.pivotPos.copy(spot.point).addScaledVector(spot.n, ORN * 0.22);
    plan.centreLocal = new THREE.Vector3();
  }
  const toWorld = v => v.clone().applyQuaternion(plan.pivotQuat).add(plan.pivotPos);
  plan.centre = toWorld(plan.centreLocal);
  plan.face = toWorld(plan.centreLocal.clone().add(new THREE.Vector3(0, 0, ORN * 0.45)));
  return plan;
}
// home pose from the plan and the ornament's own height (the string meets its loop)
function seatOnPlan(n) {
  const plan = n.plan, top = n.orn.top;
  n.home = { p: plan.hang ? new THREE.Vector3(0, -plan.L - top, plan.zOut) : new THREE.Vector3(), q: new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, plan.roll)) };
  if (n.string) { n.pivot.remove(n.string); n.string.geometry.dispose(); n.string = null; }
  if (plan.hang) {
    n.string = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, -plan.L, plan.zOut)]),
      new THREE.LineBasicMaterial({ color: C.clay }));
    n.pivot.add(n.string);
  }
  if (n !== opened) { n.root.position.copy(n.home.p); n.root.quaternion.copy(n.home.q); }
}
function hangOnTree(n, plan) {
  const pivot = new THREE.Group();
  pivot.position.copy(plan.pivotPos); pivot.quaternion.copy(plan.pivotQuat);
  scene.add(pivot); n.pivot = pivot; n.plan = plan; n.string = null;
  pivot.add(n.root);
  seatOnPlan(n);
}

// ---------- interaction: pick, bring, read, put back ----------
const ptr = new THREE.Vector2(); let hovered = null, press = null, opened = null, anim = null;

function pick(e) {
  if (!tree) return null; // still loading
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ptr, camera); raycaster.far = 20;
  const hit = raycaster.intersectObjects([tree, ...notes.map(n => n.root)], true)[0];
  return hit?.object.userData.note ?? null;
}
canvas.addEventListener('pointerdown', e => { press = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
canvas.addEventListener('pointermove', e => { if (!opened && e.pointerType === 'mouse') setHover(pick(e)); });
canvas.addEventListener('pointerup', e => {
  const wasClick = press && press.id === e.pointerId && Math.hypot(e.clientX - press.x, e.clientY - press.y) <= 6;
  press = null;
  if (!wasClick) return;
  const n = pick(e);
  // while a note is out (flying, opening or open), a click anywhere else puts it back
  if (opened) { if (n !== opened) closeNote(); return; }
  if (n) openNote(n);
});
canvas.addEventListener('pointercancel', () => { press = null; });
addEventListener('keydown', e => { if (e.key === 'Escape') closeNote(); });
function setHover(n) { if (n === hovered) return; hovered = n; canvas.classList.toggle('hover', !!n); }

function openNote(n) {
  if (opened || anim) return false; // one note out at a time
  setHover(null);
  n.lift = 0; n.root.scale.setScalar(1); setGlow(n, 0);
  n.root.position.copy(n.home.p); n.root.quaternion.copy(n.home.q);
  scene.attach(n.root);
  n.flight = { from: { p: n.root.position.clone(), q: n.root.quaternion.clone() }, to: openTarget() };
  n.shellDrop = shellDrop();
  if (n.string) n.string.visible = false;
  writeText(n.pk);
  opened = n; anim = { n, dir: 1, speed: 1 };
  document.body.classList.add('reading');
  return true;
}
// works from any point of the way out: everything runs backwards from where it is
function closeNote() {
  if (!opened || (anim && anim.dir < 0)) return;
  anim = { n: opened, dir: -1, speed: 1.6 };
}
function finishClose(n) {
  n.pivot.attach(n.root);
  n.root.position.copy(n.home.p); n.root.quaternion.copy(n.home.q);
  if (n.string) n.string.visible = true;
  eraseText(n.pk); n.flight = null; opened = null;
  document.body.classList.remove('reading');
}
// the packet is kept centred on the note's root, so the root sits on the camera axis
function openDist() {
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max((SHEET.H + 0.012) / (0.88 * 2 * tanH), (SHEET.W + 0.012) / (0.9 * 2 * tanH * camera.aspect));
}
function openTarget() {
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  return { p: camera.position.clone().addScaledVector(dir, openDist()), q: camera.quaternion.clone() };
}
const shellDrop = () => openDist() * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.8;
const setGlow = (n, k) => { n.orn.mats.main.emissiveIntensity = n.orn.mats.accent.emissiveIntensity = k; };

// ---------- loop ----------
function resize() {
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  renderer.setSize(cw, ch, false); camera.aspect = cw / ch; camera.updateProjectionMatrix();
  // retarget only while coming out or open, never on the way back
  if (opened && (!anim || anim.dir > 0)) { opened.flight.to = openTarget(); opened.shellDrop = shellDrop(); applyNote(opened, opened.t); }
}
new ResizeObserver(() => resize()).observe(canvas); // the panel below the view can change the canvas height
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const n of notes) {
    if (n === opened) continue;
    const target = n === hovered ? 1 : 0;
    n.lift += (target - n.lift) * Math.min(1, dt * 12);
    n.root.position.copy(n.home.p); n.root.position.z += 0.015 * n.lift;
    n.root.scale.setScalar(1 + 0.08 * n.lift);
    setGlow(n, 0.3 * n.lift);
  }
  if (anim) {
    const n = anim.n, t = THREE.MathUtils.clamp(n.t + anim.dir * anim.speed * dt, 0, n.total);
    applyNote(n, t);
    if (anim.dir > 0 && t >= n.total) anim = null;
    else if (anim.dir < 0 && t <= 0) { anim = null; finishClose(n); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- colour panel (mock-only UI) ----------
let colourTarget = 'all';
function shownKinds() { return viewKind === 'mixed' ? KINDS : [viewKind]; }
function setView(kind) {
  if (opened || anim) return false;
  viewKind = kind;
  for (const n of notes) setNoteKind(n, kind === 'mixed' ? n.baseKind : kind);
  renderPanel(); return true;
}
function recolour(target, c) {
  for (const n of notes) if (target === 'all' || n.kind === target) { Object.assign(n.colors, c); n.orn.setColors(c); }
}
function chip(label, on, act) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.className = 'chip' + (on ? ' on' : '');
  b.addEventListener('click', act); return b;
}
function renderPanel() {
  const kinds = document.getElementById('kinds'), targets = document.getElementById('targets');
  kinds.replaceChildren(chip('섞어서', viewKind === 'mixed', () => setView('mixed')),
    ...KINDS.map(k => chip(KIND_KO[k], viewKind === k, () => setView(k))));
  if (colourTarget !== 'all' && !shownKinds().includes(colourTarget)) colourTarget = 'all';
  targets.replaceChildren(chip('모두', colourTarget === 'all', () => { colourTarget = 'all'; renderPanel(); }),
    ...shownKinds().map(k => chip(KIND_KO[k], colourTarget === k, () => { colourTarget = k; renderPanel(); })));
}
function buildPanel() {
  const sw = document.getElementById('swatches');
  for (const [name, hex] of MAIN_SWATCHES) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'swatch'; b.title = name; b.style.background = hex;
    b.addEventListener('click', () => { recolour(colourTarget, { main: hex }); document.getElementById('free').value = hex; });
    sw.append(b);
  }
  document.getElementById('free').addEventListener('input', e => recolour(colourTarget, { main: e.target.value }));
  const ac = document.getElementById('accents');
  for (const k of Object.keys(ACCENTS)) ac.append(chip(ACCENT_KO[k], false, e => {
    recolour(colourTarget, { accent: k });
    ac.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === e.currentTarget));
  }));
  renderPanel();
}

// ---------- scale strip (?scale=1): every kind, a closed 쪽지, and one Kenney bauble ----------
function buildScaleStrip() {
  camera.updateMatrixWorld();
  const items = KINDS.map((k, i) => buildOrnament(k, { main: MAIN_SWATCHES[i][1], accent: 'gold' }).group);
  const pk = buildPacket(cards[0]); pk.root.visible = true; pk.root.scale.setScalar(1); items.push(pk.root);
  const D = 1.1, step = 0.148, y = -0.36, x0 = -(items.length) / 2 * step;
  const slot = i => new THREE.Vector3(x0 + i * step, y, -D).applyMatrix4(camera.matrixWorld);
  items.forEach((g, i) => { g.position.copy(slot(i)); g.quaternion.copy(camera.quaternion); scene.add(g); });
  // one real Kenney bauble: the tree's triangles that lie wholly inside that bauble's measured box
  const src = (() => { let m; tree.traverse(o => { if (o.isMesh && !m) m = o; }); return m; })();
  const bc = KENNEY_BAUBLES[0], half = new THREE.Vector3(...KENNEY_BAUBLE).multiplyScalar(0.5).addScalar(0.002);
  const bbox = new THREE.Box3(bc.clone().sub(half), bc.clone().add(half));
  const geo = src.geometry.index ? src.geometry.toNonIndexed() : src.geometry.clone();
  const pos = geo.attributes.position, keep = [], v = new THREE.Vector3();
  for (let t = 0; t < pos.count; t += 3) {
    let inside = true;
    for (let j = 0; j < 3; j++) { v.fromBufferAttribute(pos, t + j).applyMatrix4(src.matrixWorld); if (!bbox.containsPoint(v)) inside = false; }
    if (inside) keep.push(t, t + 1, t + 2);
  }
  const part = new THREE.BufferGeometry();
  for (const [name, attr] of Object.entries(geo.attributes)) {
    const arr = new attr.array.constructor(keep.length * attr.itemSize);
    keep.forEach((src2, d) => { for (let c = 0; c < attr.itemSize; c++) arr[d * attr.itemSize + c] = attr.array[src2 * attr.itemSize + c]; });
    part.setAttribute(name, new THREE.BufferAttribute(arr, attr.itemSize));
  }
  const kb = new THREE.Mesh(part, src.material);
  kb.matrix.copy(src.matrixWorld); kb.matrix.decompose(kb.position, kb.quaternion, kb.scale);
  kb.position.add(slot(items.length).sub(bc));
  scene.add(kb);
}

// ---------- boot ----------
resize();
// load every hand for exactly the characters it will draw (Korean webfonts come in unicode-range subsets)
const fontLoads = [];
for (const d of cards) {
  fontLoads.push(document.fonts.load(`40px "${fontFor(d)}"`, d.msg + (d.name ?? '익명') + '- '));
  if (d.reply) fontLoads.push(document.fonts.load(`40px "${REPLY_FONT}"`, d.reply));
}
await Promise.race([Promise.allSettled(fontLoads), new Promise(r => setTimeout(r, 8000))]);
const gltf = await new GLTFLoader().loadAsync(TREE_URL);
tree = gltf.scene;
const box = new THREE.Box3().setFromObject(tree);
tree.scale.setScalar(TREE_H / (box.max.y - box.min.y));
tree.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(tree); tree.updateMatrixWorld(true);
placeNotes();
buildPanel();
if (new URLSearchParams(location.search).get('scale') === '1') buildScaleStrip();
// test hooks
const _m = document.createElement('canvas').getContext('2d');
window.__mock = {
  cardCount: notes.length,
  screenOf: i => { const v = notes[i].root.getWorldPosition(new THREE.Vector3()).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
  worldOf: i => { notes[i].root.updateWorldMatrix(true, false); return [...notes[i].root.matrixWorld.elements]; },
  isOpen: () => !!opened && !anim, isBusy: () => !!anim, openIndex: () => opened ? opened.i : -1,
  t: () => opened ? [opened.t, opened.total, anim ? anim.dir : 0] : null,
  phases: () => ({ fly: N_FLY, openAt: N_OPEN_AT, open: N_OPEN, offset: notes[0].offset }),
  tryOpen: i => openNote(notes[i]),
  hold: t => { if (!opened) return; anim = null; applyNote(opened, t); },
  release: () => { if (opened) anim = { n: opened, dir: -1, speed: 1.6 }; },
  resume: () => { if (opened) anim = { n: opened, dir: 1, speed: 1 }; },
  kindOf: i => notes[i].kind, kinds: () => notes.map(n => n.kind),
  setView, recolour,
  colourOf: i => '#' + notes[i].orn.mats.main.color.getHexString(),
  hasReply: i => !!cards[i].reply, msgLen: i => [...cards[i].msg].length,
  centre: () => { if (!opened) return null; const v = opened.root.getWorldPosition(new THREE.Vector3()).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
  wrapTest: (text, px, maxW) => { _m.font = `${px}px sans-serif`; return wrap(_m, text, maxW); },
};
frame();
