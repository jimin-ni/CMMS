  { name: '도토리묵', date: '2026-12-16', msg: '진지하게 써 볼게요.\n올해 이사하고 회사도 옮기느라 정신없었는데 퇴근하고 방송 켜 두면 그게 하루 중 제일 편한 시간이었어요. 정말 고마워요!!' },
  { name: '고양이발', date: '2026-12-20', msg: '우리 집 고양이도\n방송 소리 나면\n화면 앞에 앉아요', reply: '고양이 시청자님 환영합니다 🐾' },
];

const C = { olive: 0x565344, clay: 0xA6613C, paper: 0xf3e9d6 };
const TREE_H = 1.8, EYE = 1.6, LOOK_Y = 0.92;

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b281f);
const camera = new THREE.PerspectiveCamera(50, 1, 0.02, 30);

// a cosy sunset evening: dim warm sky light, a low orange sun from the side, a faint dusk-violet fill
scene.add(new THREE.HemisphereLight(0xffb98a, 0x3a2a22, 0.55));
const fill = new THREE.DirectionalLight(0x9a7fb0, 0.3); fill.position.set(2.5, 2.2, 4); scene.add(fill);
const sun = new THREE.DirectionalLight(0xff8f4a, 1.4);
sun.position.set(-3.5, 1.5, 2.0); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 0.5, far: 10 });
scene.add(sun);

// closed room around the tree: paper walls, warm wood floor
// box faces: +x, -x, +y (ceiling), -y (floor), +z, -z
const wallMat = new THREE.MeshStandardMaterial({ color: C.paper, roughness: 0.95, side: THREE.BackSide });
const ceilMat = new THREE.MeshStandardMaterial({ color: 0xe6d9c2, roughness: 1, side: THREE.BackSide });
const floorMat = new THREE.MeshStandardMaterial({ color: 0xa88462, roughness: 0.85, side: THREE.BackSide });
const room = new THREE.Mesh(new THREE.BoxGeometry(9, 3.2, 8), [wallMat, wallMat, ceilMat, floorMat, wallMat, wallMat]);
room.position.set(0, 1.6, 2.4); room.receiveShadow = true; scene.add(room);
const TREE_URL = 'assets/tree-decorated.glb';
// everything that belongs to the tree (tree, ornaments, lights, star) turns together about the trunk.
// The camera and the room stay put, so opening a note still flies toward a fixed view.
const rig = new THREE.Group(); scene.add(rig);
// placement math works in the rig's own frame: run it with the rig turned back to 0 for a moment
function inRigFrame(fn) {
  const turn = rig.rotation.y; rig.rotation.y = 0; rig.updateMatrixWorld(true);
  try { return fn(); } finally { rig.rotation.y = turn; rig.updateMatrixWorld(true); }
}

// glow: only what is brighter than the room (bulbs, the star) bleeds light; OutputPass tone-maps at the end
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.6, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- camera: one fixed first-person view, the front of the tree fills it ----------
const CAM_DIST = 2.05;
camera.position.set(0, EYE, CAM_DIST);
camera.lookAt(0, LOOK_Y, 0);

// =====================================================================
// 쪽지 (folded note)
//
// The classroom knot (Yoon's reference, refs/jjokji-steps.png). Closing order; opening plays it backwards:
//   0  portrait sheet folded in half lengthwise, then in half again -> long strip (4 layers)
//   1  strip lying horizontal
//   2  the left end folds down on a 45° crease: a short tip hangs down (mirrored ㄱ)
//   3  the long part folds down on the other diagonal, beside the tip: two tails and a peaked roof
//   4  the long end folds on 45° to the left, in front of the tip: one tail left, one tail down
// Finished: a diamond head with a + of creases, a band running left, a tail running down.
//
// Geometry: the sheet is cut into strip segments along the creases, each segment into its
// 4 lengthwise columns (crease positions mirror from column to column, as on a real unfolded 쪽지).
// Every crease is a hinge: a group at a point on the crease, rotated about the crease line.
// The roof triangle is the root and never moves, so the writing side always faces the viewer.
//
// buildPacket(data) makes one packet from { name, date, msg, reply? } and knows nothing about the
// tree, so a writing flow can reuse it.
// =====================================================================
const KW = 0.036;                             // strip width = sheet width / 4
const STRIP_L = 6.5 * KW;                     // strip length = sheet height
const SHEET = { W: 4 * KW, H: STRIP_L };      // 0.144 x 0.234 m
const LD = 0.00008;                           // one paper layer of separation
const INSIDE_SCALE = 0.35;                    // a closed packet inside its ornament
const REPLY = { W: 0.064, H: 0.08, COLS: 2, ROWS: [0.5, 0.5], DZ: 0.00003 };
const FAN_FONTS = ['Nanum Pen Script', 'Gaegu', 'Hi Melody', 'Gamja Flower', 'Cute Font', 'Single Day', 'Yeon Sung'];
const REPLY_FONT = 'East Sea Dokdo';
// some hands draw small for their px size; scale them so every hand reads at a similar size
const FONT_SCALE = { 'Nanum Pen Script': 1.3, 'Gaegu': 1.0, 'Hi Melody': 1.15, 'Gamja Flower': 1.0, 'Cute Font': 1.3, 'Single Day': 0.95, 'Yeon Sung': 1.0, 'East Sea Dokdo': 1.3 };
const NOTE_TINTS = ['#fbf7ee', '#f6efdf', '#f9f4ea', '#f2eadb', '#fdf9f2'];
const REPLY_TINT = '#f3d5bf';
const FRONT_PX = [1200, 1950], REPLY_PX = [720, 900], BACK_PX = [400, 650];

const hashStr = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return h >>> 0; };
const fontFor = data => FAN_FONTS[hashStr(data.name ?? ('익명:' + data.msg)) % FAN_FONTS.length];
const tintFor = data => NOTE_TINTS[hashStr(data.msg) % NOTE_TINTS.length];

// --- crease layout ---
// Designed in "strip coords" (X along the strip, lying horizontal as in the reference, Y across, 0..w),
// then turned 90° into sheet coords (x right 0..W, y up 0..H) for column 0: (X, Y) -> (w - Y, X).
const w = KW, TIP = 1.8 * w, L = STRIP_L;
const toSheet = ([X, Y]) => [w - Y, X];
const dirToSheet = ([dX, dY]) => [-dY, dX];
const SEGS_STRIP = {
  ROOF: [[TIP, 0], [TIP + w, w], [TIP + 2 * w, 0]],                    // root: the roof triangle, never moves
  TIP:  [[0, 0], [TIP, 0], [TIP + w, w], [0, w]],                      // short end, hangs down (step 2)
  TAIL: [[TIP + w, w], [TIP + 3 * w, w], [TIP + 2 * w, 0]],            // folds down beside the tip (step 3)
  BAND: [[TIP + 2 * w, 0], [TIP + 3 * w, w], [L, w], [L, 0]],          // long end, turns left in front (step 4)
};
const SEGS = Object.fromEntries(Object.entries(SEGS_STRIP).map(([k, pts]) => [k, pts.map(toSheet)]));
// [child, parent, point on crease, crease direction, a point inside the child, hinge height] (strip coords)
// hinge heights put each layer on its own level: tip behind the roof, tail in front, band in front of all
const CREASES_STRIP = [
  ['TIP', 'ROOF', [TIP, 0], [1, 1], [TIP * 0.5, 0.5 * w], -0.5 * LD],
  ['TAIL', 'ROOF', [TIP + w, w], [1, -1], [TIP + 2 * w, 0.7 * w], 11 * LD],
  ['BAND', 'TAIL', [TIP + 2 * w, 0], [1, 1], [TIP + 4 * w, 0.5 * w], -1 * LD],
];
const CREASES = CREASES_STRIP.map(([c, p, pt, d, ins, h]) => [c, p, toSheet(pt), dirToSheet(d), toSheet(ins), h]);
// lengthwise folds: column hinges at x = w, 2w, 3w. Half then half again: middle first, then both others.
// strip layers land at 0, 2, 4, 10 LD (col 0, 3, 2, 1): the gap under the top layer holds a folded reply
const COL_HEIGHT = [0, 5 * LD, 3 * LD, -1 * LD];
const COL_MAP = [x => x, x => 2 * w - x, x => 2 * w + x, x => 4 * w - x];

// --- hinge: a group on the crease; content inside is back in the parent's coordinates ---
function makeHinge(parent, px, py, height, dir, inside) {
  const axis = new THREE.Vector3(dir[0], dir[1], 0).normalize();
  const P = new THREE.Vector3(px, py, height);
  const rel = new THREE.Vector3(inside[0] - px, inside[1] - py, 0);
  const side = rel.sub(axis.clone().multiplyScalar(rel.dot(axis))).normalize();
  // swing toward the side the panel lands on (sign of the hinge height)
  const sgn = Math.sign(height || 1) * Math.sign(new THREE.Vector3().crossVectors(axis, side).z || 1);
  const group = new THREE.Group(); group.position.copy(P); parent.add(group);
  const content = new THREE.Group(); content.position.copy(P).negate(); group.add(content);
  return { group, content, axis, fold: sgn * Math.PI };
}
const setHinge = (h, f) => h.group.quaternion.setFromAxisAngle(h.axis, f * h.fold);

function polyGeometry(pts) {
  const geo = new THREE.ShapeGeometry(new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y))));
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / SHEET.W, pos.getY(i) / SHEET.H);
  return geo;
}

function buildKnot(front, back) {
  const root = new THREE.Group(), segs = {}, cols = [[], [], [], []], fronts = [];
  function segment(name, content) {
    let parent = content; const cells = [];
    for (let c = 0; c < 4; c++) {
      let cell = content;
      if (c > 0) { const h = makeHinge(parent, c * w, 0, COL_HEIGHT[c], [0, 1], [c * w + 0.01, 0]); cols[c].push(h); cell = h.content; }
      const geo = polyGeometry(SEGS[name].map(([x, y]) => [COL_MAP[c](x), y]));
      const fm = new THREE.Mesh(geo, front), bm = new THREE.Mesh(geo, back);
      fm.castShadow = bm.castShadow = true; cell.add(fm, bm); fronts.push(fm);
      cells.push(cell); parent = cell;
    }
    segs[name] = { content, cells };
  }
  segment('ROOF', root);
  const hinges = {};
  for (const [child, parent, [px, py], dir, inside, height] of CREASES) {
    const h = makeHinge(segs[parent].content, px, py, height, dir, inside);
    hinges[child] = h; segment(child, h.content);
  }
  return { root, hinges, cols, fronts, segs };
}

// --- reply: a small sheet folded 2 x 3, accordion style (as v1) ---
function buildAccordion(spec, front, back) {
  const { W, H, COLS, ROWS, DZ } = spec;
  const cw = W / COLS, rh = ROWS.map(f => f * H);
  const offC = DZ, offR = 2 * DZ * (COLS - 1) + 3 * DZ;
  const root = new THREE.Group(), rowHinges = [], colHinges = [];
  let parentRow = root, yTop = 0;
  for (let r = 0; r < ROWS.length; r++) {
    let rowContent = new THREE.Group();
    if (r === 0) root.add(rowContent);
    else {
      const s = r % 2 ? 1 : -1, g = new THREE.Group();
      g.position.set(0, -rh[r - 1], s * offR); rowContent.position.z = -s * offR;
      g.add(rowContent); parentRow.add(g);
      rowHinges.push({ group: g, axis: new THREE.Vector3(1, 0, 0), fold: -s * Math.PI });
    }
    let parentCell = rowContent;
    for (let c = 0; c < COLS; c++) {
      let cell = new THREE.Group();
      if (c === 0) rowContent.add(cell);
      else {
        const t = c % 2 ? 1 : -1, g = new THREE.Group();
        g.position.set(cw, 0, t * offC); cell.position.z = -t * offC;
        g.add(cell); parentCell.add(g);
        (colHinges[c - 1] ||= []).push({ group: g, axis: new THREE.Vector3(0, 1, 0), fold: -t * Math.PI });
      }
      const geo = new THREE.PlaneGeometry(cw, rh[r]); geo.translate(cw / 2, -rh[r] / 2, 0);
      const uv = geo.attributes.uv, u0 = c / COLS, u1 = (c + 1) / COLS, vT = 1 - yTop / H, vB = 1 - (yTop + rh[r]) / H;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, u0 + uv.getX(i) * (u1 - u0), vB + uv.getY(i) * (vT - vB));
      const fm = new THREE.Mesh(geo, front), bm = new THREE.Mesh(geo, back);
      fm.castShadow = bm.castShadow = true; cell.add(fm, bm);
      parentCell = cell;
    }
    parentRow = rowContent; yTop += rh[r];
  }
  return { root, rowHinges, colHinges, cw, rh };
}

// --- text: grapheme- and word-aware wrapping ---
const segWord = new Intl.Segmenter('ko', { granularity: 'word' });
const segGraph = new Intl.Segmenter('ko', { granularity: 'grapheme' });
const graphemes = s => Array.from(segGraph.segment(s), x => x.segment);
const CLOSERS = new Set(['.', ',', '!', '?', ')', '」', '』', '…', '~', ':', ';', ']', '}', '’', '”', '%', '·', '。', '、']);

// a line never starts with closing punctuation: it hangs on the line before instead
function wrap(g, text, maxW) {
  const out = [];
  const fits = s => g.measureText(s).width <= maxW;
  for (const para of text.split('\n')) {
    let line = '';
    const flush = () => { out.push(line.trimEnd()); line = ''; };
    for (const { segment } of segWord.segment(para)) {
      if (fits((line + segment).trimEnd())) { line += segment; continue; }
      if (!segment.trim()) { if (line.trim()) flush(); continue; }         // break at a space, drop it
      const gs = graphemes(segment);
      if (line.trim() && !CLOSERS.has(gs[0]) && fits(segment)) { flush(); line = segment; continue; }
      for (const gp of gs) {
        if (line.trim() && !fits(line + gp) && !CLOSERS.has(gp)) flush();
        line += gp;
      }
    }
    out.push(line.trimEnd());
  }
  return out.map(l => l.trimStart());
}
function ellipsize(g, s, maxW) {
  let gs = graphemes(s);
  while (gs.length && g.measureText(gs.join('') + '…').width > maxW) gs.pop();
  return gs.join('') + '…';
}
// largest size whose wrapped text fits the box; short notes come out big, long notes small, never under minPx
function fitText(g, text, font, boxW, boxH, maxPx, minPx) {
  let fit;
  // a closer hung onto a full line can overshoot boxW, so widths are checked too
  const widthOk = lines => lines.every(l => g.measureText(l).width <= boxW);
  for (let px = maxPx; px >= minPx; px -= 4) {
    g.font = `${px}px "${font}"`; const lines = wrap(g, text, boxW), lh = px * 1.22;
    fit = { px, lines, lh };
    if (lines.length * lh <= boxH && widthOk(lines)) return fit;
  }
  // smallest size: wrap narrower so hung punctuation stays inside the box
  if (!widthOk(fit.lines)) fit.lines = wrap(g, text, boxW - g.measureText('……').width);
  const keep = Math.max(1, Math.floor(boxH / fit.lh));
  if (fit.lines.length > keep) { fit.lines = fit.lines.slice(0, keep); fit.lines[keep - 1] = ellipsize(g, fit.lines[keep - 1], boxW); }
  return fit;
}
// one line: shrink to fit, then cut with an ellipsis
function fitLine(g, text, family, maxPx, minPx, maxW, weight = '') {
  let px = maxPx;
  for (; px > minPx; px -= 2) { g.font = `${weight}${px}px ${family}`; if (g.measureText(text).width <= maxW) return { px, text }; }

  mesh.geometry = geo;
  // the bounding box still counts the dropped star's vertices, so the tip is measured from kept triangles
  let tipY = -Infinity; for (const i of kept) tipY = Math.max(tipY, pos.getY(i));
  mesh.userData.tip = new THREE.Vector3(0, tipY, 0);
  bands.sort((a, b) => a.box.min.y - b.box.min.y);
  const beadGeo = new THREE.IcosahedronGeometry(1, 0), Y = new THREE.Vector3(0, 1, 0);
  // the trimmed foliage in tree units, to find the surface each bead rests on
  const leaves = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide })), ray = new THREE.Raycaster();
  const snug = (p, r, lift) => {
    const out = new THREE.Vector3(p.x, 0, p.z).normalize();
    ray.set(out.clone().multiplyScalar(2).setY(p.y), out.clone().negate());
    const hit = ray.intersectObject(leaves)[0];
    return hit ? out.multiplyScalar(2 - hit.distance + r * 0.6 + lift).setY(p.y) : p;
  };
  GARLAND_SETS.forEach((set, si) => {
    const mat = new THREE.MeshStandardMaterial({ color: set.color, roughness: 0.55, metalness: set.metal, flatShading: true });
    const beads = [];
    bands.forEach((band, k) => {
      const R = BEAD_R[si][k % 3];
      const turn = new THREE.Quaternion().setFromAxisAngle(Y, set.turns[k % 3] * Math.PI / 4);
      const path = new THREE.CatmullRomCurve3(bandPath(pos, band.verts, GARLAND_ROUND).map(p => p.applyQuaternion(turn)), true);
      const n = Math.round(path.getLength() / (R * BEAD_PITCH) * (1 - BEAD_CUT[si]));
      // each set rests a hair further out, so crossing strings sit on one another instead of merging;
      // every bead turned at random (the facets catch the light differently) and a little bigger or smaller
      for (const p of path.getSpacedPoints(n).slice(0, n)) {
        const r = R * (0.85 + rand() * 0.3);
        beads.push(new THREE.Matrix4().compose(snug(p, r, si * 0.003),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(rand() * 6.3, rand() * 6.3, 0)), new THREE.Vector3(r, r, r)));
      }
    });
    const m = new THREE.InstancedMesh(beadGeo, mat, beads.length);
    beads.forEach((b, i) => m.setMatrixAt(i, b)); m.computeBoundingSphere();
    m.position.copy(mesh.position); m.quaternion.copy(mesh.quaternion); m.scale.copy(mesh.scale);
    m.castShadow = m.receiveShadow = true; mesh.parent.add(m);
  });
  return src;
}
// A band is a ribbon: at each corner a pair of vertices across its width (lower and upper edge).
// Its centre line runs through the pairs' midpoints in angle order; each corner is replaced by two
// points `round` of the way along its two edges.
function bandPath(pos, verts, round) {
  const uniq = [];
  for (const i of verts) { const v = new THREE.Vector3().fromBufferAttribute(pos, i); if (!uniq.some(u => u.distanceTo(v) < 1e-5)) uniq.push(v); }
  const used = new Set(), corners = [];
  for (const v of uniq) {
    if (used.has(v)) continue;
    let best = null, bd = Infinity;
    for (const u of uniq) if (u !== v && !used.has(u)) { const d = v.distanceTo(u); if (d < bd) { bd = d; best = u; } }
    used.add(v); used.add(best);
    const mid = v.clone().add(best).multiplyScalar(0.5);
    corners.push({ a: Math.atan2(mid.z, mid.x), mid });
  }
  corners.sort((p, q) => p.a - q.a);
  const n = corners.length, out = [];
  for (let i = 0; i < n; i++) {
    const c = corners[i].mid, prev = corners[(i + n - 1) % n].mid, next = corners[(i + 1) % n].mid;
    out.push(c.clone().lerp(prev, round), c.clone().lerp(next, round));
  }
  return out;
}

// ---------- star on top: a low-poly puffy five-point star that shines by itself ----------
// Steady, never blinking: a warm glow round it, soft sun rays that turn slowly, and a little warm light on
// the treetop. Only the rays move.
function sunRaysTexture() {
  const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'), c = S / 2;
  g.translate(c, c);
  for (let k = 0; k < 12; k++) {
    const len = c * (k % 2 ? 0.62 : 0.95), half = k % 2 ? 0.07 : 0.1;
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, len);
    gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(0.4, 'rgba(255,255,255,.3)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0);
    g.lineTo(Math.cos(-half) * len, Math.sin(-half) * len); g.lineTo(Math.cos(half) * len, Math.sin(half) * len);
    g.closePath(); g.fill(); g.rotate(Math.PI / 6);
  }
  return new THREE.CanvasTexture(cv);
}
function buildTopStar(topY) {
  const s = new THREE.Shape(), ro = 0.06, ri = 0.027;
  for (let k = 0; k < 10; k++) { const a = Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? ri : ro; s[k ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.012, bevelEnabled: true, bevelThickness: 0.009, bevelSize: 0.006, bevelSegments: 1, curveSegments: 1 });
  geo.center();
  const star = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xf0c055, roughness: 0.55, flatShading: true, emissive: 0xffc04a, emissiveIntensity: 1.25 }));
  star.position.set(0, topY + ro * 0.85, 0);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.009, 0.03, 6), new THREE.MeshStandardMaterial({ color: 0x8a6a2e, roughness: 0.6, flatShading: true }));
  stem.position.set(0, topY + 0.008, 0);
  const sprite = (map, size, opacity) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map, color: 0xffcf7a, opacity, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
    s.scale.setScalar(size); s.position.copy(star.position).add(new THREE.Vector3(0, 0, -0.02)); return s;
  };
  const glow = sprite(haloTexture(), 0.36, 0.55), rays = sprite(sunRaysTexture(), 0.42, 0.4);
  const warm = new THREE.PointLight(0xffc070, 0.35, 0.9, 1.5); warm.position.copy(star.position).add(new THREE.Vector3(0, 0, 0.08));
  rig.add(glow, rays, star, stem, warm);
  return { update(t) { rays.material.rotation = t * 0.12; } };
}

// ---------- fairy lights ----------
// Strings of lights round the tree in the low-poly style: a brown wire draped in shallow scallops just
// outside the foliage, with small blunt bulbs that fade on and off, each at its own pace.
// Warm white strings at the bottom, middle and top, golden strings between them; every string tilted its own
// way (tilt = degrees off level, dir = the side where it is highest).
const LIGHT_STRINGS = [
  { h: 0.55, tilt: 6, dir: 1.9, color: 0xEAE5D9 }, { h: 0.9, tilt: 9, dir: 4.4, color: 0xEAE5D9 }, { h: 1.22, tilt: 7.5, dir: 0.3, color: 0xEAE5D9 },
  { h: 0.7, tilt: 10, dir: 3.6, color: 0xCDAB3D }, { h: 1.06, tilt: 12, dir: 0.8, color: 0xCDAB3D }, { h: 1.34, tilt: 17, dir: 2.2, color: 0xCDAB3D },
];
const LIGHT_GAP = 0.075, LIGHT_SAG = 0.014, LIGHT_HOOKS = 8, LIGHT_HALO = 0.085;
// soft round glow: a bright core that falls off fast, then a long, nearly clear fringe
function haloTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.12, 'rgba(255,255,255,.55)');
  gr.addColorStop(0.35, 'rgba(255,255,255,.14)'); gr.addColorStop(0.7, 'rgba(255,255,255,.03)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
}
function buildFairyLights() {
  const group = new THREE.Group(), bulbs = [];
  const wireMat = new THREE.MeshStandardMaterial({ color: 0x6b4428, roughness: 0.9, flatShading: true });
  const bulbGeo = new THREE.IcosahedronGeometry(0.0075, 0); bulbGeo.scale(1, 1.3, 1);
  const halo = haloTexture();
  for (const { h, tilt, dir, color } of LIGHT_STRINGS) {
    const glass = new THREE.Color(color).multiplyScalar(0.75);
    // a plane tilted `tilt` degrees: it rises and falls by the tree's radius at this height times tan(tilt)
    const rise = (surfaceHit(0, h)?.r ?? 0.3) * Math.tan(THREE.MathUtils.degToRad(tilt));
    // wire: hooked onto the branches LIGHT_HOOKS times round, sagging a little between hooks
    const S = 96, pts = [];
    for (let i = 0; i < S; i++) {
      const a = i / S * Math.PI * 2;
      const y = h + rise * Math.cos(a - dir) - LIGHT_SAG * Math.sin(Math.PI * ((i / S * LIGHT_HOOKS) % 1));
      const hit = surfaceHit(a, y);
      if (hit) pts.push(hit.out.clone().multiplyScalar(hit.r + 0.007).setY(y));
    }
    const curve = new THREE.CatmullRomCurve3(pts, true);
    const wire = new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 0.0012, 4, true), wireMat);
    wire.castShadow = true; group.add(wire);
    // bulbs: evenly spaced, hanging just under the wire
    const n = Math.round(curve.getLength() / LIGHT_GAP);
    curve.getSpacedPoints(n).slice(0, n).forEach(p => {
      const mat = new THREE.MeshStandardMaterial({ color: glass, roughness: 0.5, flatShading: true, emissive: color });
      const b = new THREE.Mesh(bulbGeo, mat); b.position.copy(p).add(new THREE.Vector3(0, -0.007, 0));
      const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: halo, color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
      glow.scale.setScalar(LIGHT_HALO); glow.position.copy(b.position);
      group.add(b, glow);
      bulbs.push({ mat, glow, period: 2.4 + rand() * 1.6, phase: rand() });
    });
  }
  rig.add(group);
  return {
    // smooth fade: off (dim glass) -> on (glowing) -> off, never a hard blink
    update(t) {
      for (const b of bulbs) {
        const f = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t / b.period + b.phase));
        b.mat.emissiveIntensity = 0.08 + 1.5 * f;
        b.glow.material.opacity = 0.85 * f;
      }
    },
  };
}

// ---------- boot ----------
resize();
// load every hand for exactly the characters it will draw (Korean webfonts come in unicode-range subsets)
const fontLoads = [];
for (const d of cards) {
  fontLoads.push(document.fonts.load(`40px "${fontFor(d)}"`, d.msg + (d.name ?? '익명') + '- '));
  if (d.reply) fontLoads.push(document.fonts.load(`40px "${REPLY_FONT}"`, d.reply));
}
await Promise.race([Promise.allSettled(fontLoads), new Promise(r => setTimeout(r, 8000))]);
const gltf = await new GLTFLoader().loadAsync(TREE_URL);
tree = gltf.scene;
const box = new THREE.Box3().setFromObject(tree);
tree.scale.setScalar(TREE_H / (box.max.y - box.min.y));
tree.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const treeSourceGeo = trimTree(tree);
rig.add(tree); rig.updateMatrixWorld(true);
{ let m; tree.traverse(o => { if (o.userData.tip) m = o; }); topStar = buildTopStar(m.localToWorld(m.userData.tip.clone()).y); }
lights = buildFairyLights();
placeNotes();
buildPanel();
buildTray();
ready = true;
if (new URLSearchParams(location.search).get('scale') === '1') buildScaleStrip();
// test hooks
const _m = document.createElement('canvas').getContext('2d');
window.__mock = {
  cardCount: notes.length,
  screenOf: i => { const v = notes[i].root.getWorldPosition(new THREE.Vector3()).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
  worldOf: i => { notes[i].root.updateWorldMatrix(true, false); return [...notes[i].root.matrixWorld.elements]; },
  isOpen: () => !!opened && !anim, isBusy: () => !!anim, openIndex: () => opened ? opened.i : -1,
  t: () => opened ? [opened.t, opened.total, anim ? anim.dir : 0] : null,
  phases: () => ({ fly: N_FLY, openAt: N_OPEN_AT, open: N_OPEN, offset: notes[0].offset }),
  tryOpen: i => openNote(notes[i]),
  hold: t => { if (!opened) return; anim = null; applyNote(opened, t); },
  release: () => { if (opened) anim = { n: opened, dir: -1, speed: 1.6 }; },
  resume: () => { if (opened) anim = { n: opened, dir: 1, speed: 1 }; },
  kindOf: i => notes[i].kind, kinds: () => notes.map(n => n.kind),
  turn: () => rig.rotation.y, decorCount: () => decor.length,
  setView, recolour,
  colourOf: i => '#' + notes[i].orn.mats.main.color.getHexString(),
  hasReply: i => !!cards[i].reply, msgLen: i => [...cards[i].msg].length,
  centre: () => { if (!opened) return null; const v = opened.root.getWorldPosition(new THREE.Vector3()).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
  wrapTest: (text, px, maxW) => { _m.font = `${px}px sans-serif`; return wrap(_m, text, maxW); },
};
frame();
